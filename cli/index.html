<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeltaPack CLI Reference</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px;
      color: #24292f;
      line-height: 1.6;
    }
    .back { margin-bottom: 24px; }
    .back a { color: #0969da; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    #readme h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
    #readme h2 { border-bottom: 1px solid #d0d7de; padding-bottom: 6px; margin-top: 32px; }
    #readme pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
    }
    #readme code {
      background: #f6f8fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    #readme pre code { background: none; padding: 0; }
    #readme a { color: #0969da; text-decoration: none; }
    #readme a:hover { text-decoration: underline; }
    #readme table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    #readme th, #readme td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
    #readme th { background: #f6f8fa; }
    #readme blockquote {
      border-left: 4px solid #d0d7de;
      margin: 16px 0;
      padding: 0 16px;
      color: #57606a;
    }
  </style>
</head>
<body>
  <div class="back"><a href="../">&larr; Back to DeltaPack Documentation</a></div>
  <div id="readme">Loading...</div>

  <script>
    fetch('https://raw.githubusercontent.com/hpx7/delta-pack/main/cli/README.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('readme').innerHTML = marked.parse(md);
        hljs.highlightAll();
      })
      .catch(() => {
        document.getElementById('readme').innerHTML = '<p>Failed to load README.</p>';
      });
  </script>
</body>
</html>
