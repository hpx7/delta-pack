[package]
name = "delta-pack"
description = "Binary serialization with delta compression for real-time state synchronization"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["serialization", "binary", "delta", "compression", "networking"]
categories = ["encoding", "game-development", "network-programming"]

[workspace]
members = [".", "benchmarks", "delta-pack-derive"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hpx7/delta-pack"

[dependencies]
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
delta-pack-derive = { path = "delta-pack-derive", version = "0.3.0" }

[dev-dependencies]
serde_json = "1"
