name: CLI - CI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "examples/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "examples/**"
      - ".github/workflows/cli-ci.yml"

jobs:
  test:
    name: Test cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Run tests
        run: bun test
