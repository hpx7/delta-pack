name: Rust - Publish to crates.io

on:
  push:
    branches: [main]
    paths:
      - "rust/Cargo.toml"
      - ".github/workflows/rust-publish.yml"

jobs:
  publish:
    name: Build and publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish --skip-verify
