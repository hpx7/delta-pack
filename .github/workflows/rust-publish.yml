name: Rust - Publish to crates.io

on:
  push:
    branches: [main]
    paths:
      - "rust/Cargo.toml"
      - "rust/delta-pack-derive/Cargo.toml"
      - ".github/workflows/rust-publish.yml"

jobs:
  publish:
    name: Build and publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The derive crate is a dependency of the main crate, so it must be on
      # the index first. `cargo publish` of the main crate will otherwise fail
      # with "no matching package named `delta-pack-derive` found".
      - name: Publish delta-pack-derive to crates.io
        working-directory: rust/delta-pack-derive
        run: |
          set +e
          output=$(cargo publish --no-verify 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -qE "already (uploaded|exists)"; then
              echo "::notice::delta-pack-derive: version already on crates.io, skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Give crates.io's index a moment to reflect the newly-published derive
      # crate before publishing the main crate that depends on it.
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish delta-pack to crates.io
        run: |
          set +e
          output=$(cargo publish --no-verify 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -qE "already (uploaded|exists)"; then
              echo "::notice::delta-pack: version already on crates.io, skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  docs:
    name: Publish docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate docs
        run: |
          cargo doc --no-deps
          echo '<meta http-equiv="refresh" content="0; url=delta_pack/">' > target/doc/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rust/target/doc
          destination_dir: rust
          keep_files: true
